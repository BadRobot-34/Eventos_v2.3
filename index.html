  <style>
    /* Reset & Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: Arial, sans-serif;
      background-color: #0b0b0b;
      color: #ffffff;
      padding: 20px;
    }

    /* Cabecera */
    .header-container {
      text-align: center;
      margin-bottom: 25px;
    }

    .img-titulo {
      max-width: 320px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 15px auto;
    }

    .divider {
      border: 0;
      height: 2px;
      background: #333333;
      margin-bottom: 25px;
    }

    /* Layout en Grid para Móviles y PCs normales */
    .channels-grid {
      display: grid;
      /* Ajuste dinámico con tamaño mínimo de 160px */
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .logo {
      display: block;
      aspect-ratio: 1 / 1;
      background-color: #121212;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      border: 3px solid #333333;
      border-radius: 20px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .logo:hover, .logo:focus {
      transform: scale(1.06);
      border-color: #007bff;
      box-shadow: 0 0 20px rgba(0, 123, 255, 0.5);
      outline: none;
    }

    /* Modales */
    .modalmask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 99999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modalmask:target {
      opacity: 1;
      pointer-events: auto;
    }

    .modalbox {
      background: #181818;
      border: 3px solid #444444;
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      padding: 25px;
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
      transform: scale(0.85);
      transition: transform 0.3s ease;
    }

    .modalmask:target .modalbox {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 22px;
      color: #ffffff;
      font-weight: bold;
    }

    .btn-cerrar {
      text-decoration: none;
      width: 36px;
      height: 36px;
      line-height: 32px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      color: #ffffff;
      background-color: #2a2a2a;
      border-radius: 50%;
      transition: background 0.2s ease;
    }

    .btn-cerrar:hover, .btn-cerrar:focus {
      background-color: #ff3b30;
      outline: none;
    }

    .nieta {
      margin-bottom: 20px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #333;
    }

    .nieta img {
      width: 100%;
      height: auto;
      max-height: 220px;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .nieto {
      background-color: #242424;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .servidores {
      height: 35px;
      width: auto;
      margin-bottom: 15px;
    }

    .options-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .opciones {
      width: 90px;
      height: 50px;
      background-color: #000000;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border: 2px solid #555555;
      border-radius: 8px;
      display: inline-block;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .opciones:hover, .opciones:focus {
      transform: scale(1.08);
      border-color: #007bff;
      outline: none;
    }

    /* ---------------------------------------------------
       AJUSTES ESPECÍFICOS PARA PANTALLAS GRANDES / TV 
    --------------------------------------------------- */
    @media screen and (min-width: 1200px) {
      body {
        padding: 40px;
      }

      .img-titulo {
        max-width: 450px;
      }

      .channels-grid {
        /* Iconos más grandes: Mínimo 220px por icono */
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 30px;
        max-width: 1600px;
      }

      .logo {
        border-width: 4px;
        border-radius: 24px;
      }

      /* Modales escalados para TV */
      .modalbox {
        max-width: 600px;
        padding: 35px;
        border-width: 4px;
      }

      .modal-header h2 {
        font-size: 28px;
      }

      .btn-cerrar {
        width: 46px;
        height: 46px;
        line-height: 42px;
        font-size: 22px;
      }

      .nieta img {
        max-height: 300px;
      }

      .servidores {
        height: 45px;
      }

      .opciones {
        width: 120px;
        height: 65px;
      }
    }
